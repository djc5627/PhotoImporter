name: Test and build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install Qt libraries and ExifTool
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon0 libimage-exiftool-perl
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q
        env:
          QT_QPA_PLATFORM: offscreen

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install Inno Setup if missing
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }
      - name: Build app, portable zip and installer
        shell: pwsh
        run: ./packaging/build.ps1
      - name: Test (with the bundled ExifTool)
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $env:PATH = "$PWD\dist\PhotoImporter\exiftool;$env:PATH"
          uv run pytest -q
      - name: Check the packaged app starts
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          APPDATA: ${{ runner.temp }}\appdata
        run: |
          $app = Start-Process dist\PhotoImporter\PhotoImporter.exe -PassThru
          Start-Sleep -Seconds 15
          if ($app.HasExited) { throw "PhotoImporter.exe exited early with code $($app.ExitCode)" }
          Stop-Process -Id $app.Id
      - uses: actions/upload-artifact@v4
        with:
          name: PhotoImporter-windows
          path: |
            dist/*-setup.exe
            dist/*-portable.zip
          if-no-files-found: error
