[project]
name = "photoimporter"
dynamic = ["version"]
description = "Import new photos from camera SD cards into dated, per-camera folders."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["PySide6-Essentials>=6.8"]

[project.scripts]
photoimporter = "photoimporter.cli:main"

[project.gui-scripts]
photoimporter-gui = "photoimporter.ui.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/photoimporter/__init__.py"

[dependency-groups]
dev = ["pytest>=8", "pytest-qt>=4.4", "ruff>=0.6"]
build = ["pyinstaller>=6.10"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
