[project]
name = "photoimporter"
version = "0.1.0"
description = "Import new photos from camera SD cards into dated, per-camera folders."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
photoimporter = "photoimporter.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
